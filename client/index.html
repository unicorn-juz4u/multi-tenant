<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>SaaSify | Enterprise Multi-Tenant Cloud Platform</title>
    <meta name="title" content="SaaSify | Enterprise Multi-Tenant Cloud Platform" />
    <meta name="description" content="Production-ready multi-tenant SaaS application with row-level tenant isolation, JWT authentication, and strict single-source-of-truth state architecture." />
    <meta name="keywords" content="multi-tenant, saas, react, redux toolkit, nodejs, express, mongodb, jwt auth, rbac, enterprise" />
    <meta name="author" content="SaaSify Inc." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://saasify.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://saasify.app/" />
    <meta property="og:site_name" content="SaaSify" />
    <meta property="og:title" content="SaaSify | Enterprise Multi-Tenant Cloud Platform" />
    <meta property="og:description" content="Production-ready multi-tenant SaaS application with row-level tenant isolation, JWT authentication, and strict single-source-of-truth state architecture." />
    <meta property="og:image" content="https://saasify.app/favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://saasify.app/" />
    <meta name="twitter:title" content="SaaSify | Enterprise Multi-Tenant Cloud Platform" />
    <meta name="twitter:description" content="Production-ready multi-tenant SaaS application with row-level tenant isolation, JWT authentication, and strict single-source-of-truth state architecture." />
    <meta name="twitter:image" content="https://saasify.app/favicon.svg" />

    <!-- Theme & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SaaSify",
        "url": "https://saasify.app",
        "description": "Production-grade multi-tenant SaaS application with row-level isolation, JWT dual-token authentication, and role-based access control.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All modern browsers",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Row-Level Tenant Isolation",
          "Dual JWT Authentication with Silent Refresh",
          "Role-Based Access Control (Owner, Admin, Member)",
          "Strict Single Source of Truth Redux Store",
          "Normalized Entity Adapters",
          "Responsive Dark Mode UI"
        ]
      }
    </script>

    <!-- Prevent Dark Mode Flicker -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
